apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: eks-nginx
        image: 957143340841.dkr.ecr.us-east-1.amazonaws.com/ecr-nginx:2.0
        ports:
        - containerPort: 80
